[package]
name = "tekmerion-sdk"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Tekmerion instruction builders, Anchor CPI, validated account views and optional RPC client"

[workspace]

[features]
default = ["mainnet", "host"]
mainnet = ["tekmerion/mainnet"]
devnet = ["tekmerion/devnet"]
host = []
rpc = [
    "host", "dep:bincode", "dep:solana-account", "dep:solana-message",
    "dep:solana-rpc-client", "dep:solana-sanitize", "dep:solana-sdk-ids", "dep:solana-signature",
    "dep:solana-signer", "dep:solana-transaction", "dep:tokio", "dep:wincode",
]
cpi = ["tekmerion/cpi"]
idl-build = ["tekmerion/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.1", default-features = false, features = ["solana-v3"] }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["solana-v3", "token"] }
tekmerion = { path = "../../programs/tekmerion", default-features = false, features = ["no-entrypoint"] }
solana-instruction = "~3.4.0"
bincode = { version = "=1.3.3", optional = true }
solana-account = { version = "=4.3.2", optional = true }
solana-message = { version = "=4.4.1", optional = true }
solana-rpc-client = { version = "=4.2.0", default-features = false, optional = true }
solana-sanitize = { version = "=3.0.1", optional = true }
solana-sdk-ids = { version = "=3.1.0", optional = true }
solana-signature = { version = "=3.4.1", optional = true }
solana-signer = { version = "=3.0.1", optional = true }
solana-transaction = { version = "=4.1.6", features = ["wincode", "verify"], optional = true }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros"], optional = true }
wincode = { version = "=0.5.5", optional = true }

[dev-dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
serde_json = "=1.0.151"
solana-keypair = "=3.1.2"

[profile.dev]
debug = 0

[profile.test]
debug = 0
