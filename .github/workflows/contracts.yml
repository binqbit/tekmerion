name: Local contract and SDK tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            sdk/chainlink-typescript/package-lock.json
            workflows/chainlink-appeals/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - name: Prepare dependencies and run all local tests
        run: bash scripts/test.sh
      - name: Build the production contract bundle
        run: bash scripts/build.sh
      - name: Verify SDK package contents
        run: |
          npm pack ./sdk/typescript --dry-run
          npm pack ./sdk/chainlink-typescript --dry-run
