[package]
name = "tekmerion-chainlink-auditor"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "chainlink_auditor"
crate-type = ["cdylib", "lib"]

[features]
default = ["mainnet"]
mainnet = ["tekmerion-sdk/mainnet"]
devnet = ["tekmerion-sdk/devnet"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "tekmerion-sdk/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
tekmerion-sdk = { path = "../../sdk/rust", default-features = false, features = ["cpi"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[lints]
workspace = true
